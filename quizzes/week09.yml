# Week 9 quiz — refresher on basic Python and programming constructs.

quiz:
  week: 9
  title: "Week 9 Quiz"
  covers: "Python refresher: variables, lists, functions, if statements, for loops"
  given: "Tuesday, October 20, start of class"
  time_limit_minutes: 5
  default_points: 1

questions:

  - type: mc
    title: "Tracing variable assignments"
    text: |
      What does this code print?
      <pre><code>flow = 4
      previous = flow
      flow = flow + 3
      print(previous + flow)</code></pre>
    difficulty: 2
    feedback: >
      `previous` keeps the value `4` assigned to it. Updating `flow` to `7`
      does not change `previous`, so the sum is `4 + 7 = 11`.
    options:
      - text: "`14`"
        feedback: "Assigning an integer does not create a live link between the variables."
      - text: "`11`"
        correct: true
        feedback: "Correct — previous is still 4, while flow is now 7."
      - text: "`8`"
        feedback: "The third line updates flow to 7 before the sum is printed."
      - text: "`7`"
        feedback: "The print statement adds previous to flow."

  - type: mc
    title: "Slicing a list"
    text: |
      What does this code print?
      <pre><code>depths = [12, 18, 25, 30]
      selected = depths[1:3]
      print(sum(selected))</code></pre>
    difficulty: 2
    feedback: >
      List indices start at zero, and a slice excludes its stop index.
      `depths[1:3]` selects `18` and `25`, whose sum is `43`.
    options:
      - text: "`55`"
        feedback: "That sums indices 0 through 2; the slice starts at index 1."
      - text: "`73`"
        feedback: "The stop index 3 is excluded, so 30 is not selected."
      - text: "`43`"
        correct: true
        feedback: "Correct — the slice contains 18 and 25."
      - text: "`18`"
        feedback: "The slice includes both index 1 and index 2."

  - type: mc
    title: "Function arguments and return values"
    text: |
      What does this code print?
      <pre><code>def adjust(value):
          value = value + 2
          return value * 3

      flow = 4
      result = adjust(flow)
      print(flow + result)</code></pre>
    difficulty: 2
    feedback: >
      Inside the function, the local parameter `value` becomes `6`, and the
      function returns `18`. This does not reassign the caller's `flow`,
      which remains `4`. The printed sum is `4 + 18 = 22`.
    options:
      - text: "`22`"
        correct: true
        feedback: "Correct — flow remains 4 and result is 18."
      - text: "`24`"
        feedback: "Reassigning the local parameter does not change flow to 6."
      - text: "`18`"
        feedback: "18 is the returned value, but the print statement also adds flow."
      - text: "`16`"
        feedback: "The function adds 2 before multiplying by 3."

  - type: mc
    title: "Following an if/elif chain"
    text: |
      What does this code print?
      <pre><code>rainfall = 25
      if rainfall >= 10:
          label = "Moderate"
      elif rainfall >= 20:
          label = "Heavy"
      else:
          label = "Light"
      print(label)</code></pre>
    difficulty: 2
    feedback: >
      Python runs the first matching branch in an `if`/`elif`/`else` chain.
      `25 >= 10` is true, so the label becomes `Moderate` and the `elif`
      branch is skipped. To classify 25 as Heavy, check the higher threshold first.
    options:
      - text: "`Heavy`"
        feedback: "The elif condition is not checked after the first branch matches."
      - text: "`Light`"
        feedback: "The else branch runs only if neither preceding condition matches."
      - text: "Both `Moderate` and `Heavy`"
        feedback: "Only one branch runs, and there is only one print statement."
      - text: "`Moderate`"
        correct: true
        feedback: "Correct — the first matching branch determines the label."

  - type: mc
    title: "Combining a for loop and a condition"
    text: |
      What does this code print after the loop finishes?
      <pre><code>total = 0
      for i in range(5):
          if i > 2:
              total = total + i
      print(total)</code></pre>
    difficulty: 2
    feedback: >
      `range(5)` produces `0, 1, 2, 3, 4`; the stop value `5` is excluded.
      The condition selects values greater than `2`, so only `3` and `4` are added.
      The final total is `7`.
    options:
      - text: "`10`"
        feedback: "That sums every value in the range, ignoring the condition."
      - text: "`7`"
        correct: true
        feedback: "Correct — only 3 and 4 pass the condition."
      - text: "`4`"
        feedback: "4 is the last value added, but total also includes 3."
      - text: "`2`"
        feedback: "Two values pass the condition, but the code sums their values."
