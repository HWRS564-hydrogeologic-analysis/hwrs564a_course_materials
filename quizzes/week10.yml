# Week 10 quiz — covers Week 9 (Pinal County model startup).

quiz:
  week: 10
  title: "Week 10 Quiz"
  covers: "Week 9 — basic structure of the Pinal County model"
  given: "Tuesday, October 27, start of class"
  time_limit_minutes: 5
  default_points: 1

questions:

  - type: mc
    title: "Number of layers"
    text: >
      How many layers does the Pinal County model have?
    difficulty: 1
    feedback: >
      The DIS package sets `nlay = 3` on a grid of 196 rows and 222 columns.
      Each layer's top and bottom elevations are read from external files.
    options:
      - text: "3"
        correct: true
        feedback: "Correct."
      - text: "1"
        feedback: >
          The model has more than one layer. The `ibound` plot in the startup
          notebook shows one panel for each layer.
      - text: "5"
        feedback: "Check `dis.nlay` in the startup notebook."
      - text: "10"
        feedback: "Check `dis.nlay` in the startup notebook."

  - type: mc
    title: "Model time periods"
    text: >
      Which list matches the time periods in the Pinal County model?
    difficulty: 2
    feedback: >
      There are 194 stress periods. Stress period 1 is a steady-state
      predevelopment period (1922). Stress periods 2–94 are the historic
      transient period, 1923–2015, one year each. Stress periods 95–194 are
      the 100-year projection, 2016–2115.
    options:
      - text: "A steady-state 1922 period, historic years 1923–2015, and projected years 2016–2115"
        correct: true
        feedback: "Correct."
      - text: "A single steady-state period representing present-day conditions"
        feedback: "Only the first of the 194 stress periods is steady state."
      - text: "Historic years 1923–2015 only, all transient"
        feedback: >
          That leaves out both the steady-state starting period and the
          100-year projection.
      - text: "Monthly stress periods from 2000 to 2025"
        feedback: "The stress periods are one year long and run from 1922 to 2115."

  - type: mc
    title: "Major river"
    text: >
      What is the major river in the Pinal County model domain? It enters on
      the east side with a large specified inflow and flows west across the
      model.
    difficulty: 1
    feedback: >
      The Gila River is STR segment 1: 150 reaches running east to west past
      Florence. Segment 2, which is shorter, is the Santa Cruz.
    options:
      - text: "Gila River"
        correct: true
        feedback: "Correct."
      - text: "Santa Cruz River"
        feedback: >
          The Santa Cruz is in the model, but it is the shorter segment
          (segment 2). It has no specified inflow at its upstream end.
      - text: "Colorado River"
        feedback: "The Colorado is far to the west of Pinal County."
      - text: "Salt River"
        feedback: "The Salt runs through Phoenix, north of the model domain."

  - type: mc
    title: "Cell size"
    text: >
      Every cell in the Pinal County model is the same size. How wide is a
      cell?
    difficulty: 2
    feedback: >
      `delr` and `delc` are both a constant 2640 ft, which is half a mile.
      That is about three times the 250 m cells in our class models, so the
      head the model reports in a cell with a pumping well is an average over
      a large area and will be well above the head in the well itself.
    options:
      - text: "2640 ft (half a mile)"
        correct: true
        feedback: "Correct."
      - text: "250 m"
        feedback: "That is the cell size in our class models, not the Pinal model."
      - text: "100 ft"
        feedback: "Much smaller than the model uses. Check `dis.delr` in the startup notebook."
      - text: "1 mile"
        feedback: "Close, but the cells are half that."

  - type: mc
    title: "Solver"
    text: >
      Which solver does the Pinal County model use?
    difficulty: 2
    feedback: >
      The name file lists `GMG`, the Geometric Multigrid solver. Its comment
      says it was adjusted so the model converges in all 194 years. GMG is
      built for large grids like this one, which has more than 130,000 cells.
    options:
      - text: "GMG (Geometric Multigrid)"
        correct: true
        feedback: "Correct."
      - text: "PCG"
        feedback: >
          That is the solver in our class models. The Pinal name file lists a
          different one.
      - text: "NWT"
        feedback: >
          The model runs in MODFLOW-2005 with LPF, not MODFLOW-NWT with UPW.
      - text: "SIP"
        feedback: "Check the solver line in the name file."
