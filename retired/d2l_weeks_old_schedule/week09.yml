week: 9
title: "Week 9 — Ordinary least squares and linear regression"
dates: "October 20 & 22, 2026"
overview: >
  Tuesday derives ordinary least squares from the definition of a residual,
  spelling out both normal equations and every algebraic step leading to the
  slope and intercept. We then connect the fitted line to R-squared, residual
  variance, slope standard error, confidence intervals, and hypothesis tests.
  Thursday is a full-period lab: students reproduce the calculations, diagnose
  assumption failures, compare random and chronological validation, and write
  a careful interpretation of what the linear model can and cannot support.

