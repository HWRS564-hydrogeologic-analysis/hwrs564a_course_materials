week: 11
title: "Week 11 — Inputs, outputs, and hitting go"
dates: "November 3 & 5, 2026"
overview: >
  This week you build a model of the actual Tucson basin: 15 km by 10 km at 250 m
  resolution, on land-surface elevations fitted to the 1,693 USGS wells you have
  been working with since Week 5. Add a wellfield and recharge, run it, and map
  the result. Then read the water budget, which is the only place a model tells
  you where the pumped water came from — and compare modelled depth to water
  against 80 real monitoring wells, which is where you find out what your invented
  boundary conditions cost you.

