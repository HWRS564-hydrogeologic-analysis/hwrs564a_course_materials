[project]
name = "hwrs564a-course-materials"
version = "2026.0.0"
description = "HWRS 564a — Hydrogeologic Analysis Tools & Methods I, Fall 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # core scientific stack
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "matplotlib>=3.10.5",
    "scipy>=1.14",
    # groundwater modeling
    "flopy>=3.9.3",
    # notebooks
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    # data access and formats
    "aiohttp>=3.12.15",
    "dataretrieval>=1.0.11",
    "netcdf4>=1.7.2",
    "openpyxl>=3.1.5",       # read the one Excel file in week 5
    "pooch>=1.8.2",
    "xarray>=2025.7.1",
    # mapping and domain plotting
    "cartopy>=0.25.0",
    # week 9 regression
    "scikit-learn>=1.5",
    # build tooling for slides, quizzes, and D2L pages
    "pyyaml>=6.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
# Instructor-side only. Students never run these, but `uv sync` installs them
# by default so CI and a fresh clone both have them without a second command.
dev = [
    "pytest>=8.3",
    "nbmake>=1.5",       # executes every notebook top-to-bottom under pytest
    "nbstripout>=0.8",   # pre-commit hook: never commit notebook outputs
]

[tool.pytest.ini_options]
# Only the generated solutions copies are runnable — the student notebooks are
# full of `...` placeholders by design. Regenerate first:
#   python scripts/fill_solutions.py labs/*/*.ipynb
# Which notebooks get collected is decided in labs/conftest.py: only the
# generated _solutions/ copies are runnable.
testpaths = ["labs"]
addopts = "--nbmake --nbmake-timeout=600"

[tool.uv]
# Keep the resolution reproducible for students; refresh deliberately, not by accident.
package = false
