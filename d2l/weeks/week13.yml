week: 13
title: "Week 13 — Wells, recharge, ET, and transient flow"
dates: "November 17 & 19, 2026"
banner: snakes.png
banner_alt: "Two pythons"

overview: >
  Every model so far has been steady state, which answers what the aquifer
  settles down to if nothing changes. Water managers ask *when* — when the water
  table reaches the pump intake, and how much of what we pump this year comes out
  of storage rather than out of recharge. This week adds time: stress periods,
  storage properties, a hydrograph read out of the model, and the distinction
  between depletion and capture that safe-yield regulation is built on. Plus the
  ET package, and the feedback that connects pumping to riparian habitat.

