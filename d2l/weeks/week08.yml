week: 8
title: "Week 8 — More on matplotlib"
dates: "October 13 & 15, 2026"
overview: >
  Up to now you have made plots to find out what the data says. This week you
  make plots to tell someone else, which is a different job with different
  rules. Most of the difference is not aesthetic: a figure that encodes its
  meaning in colour alone is unreadable to about one reader in twelve, and a
  diverging colormap that isn't centred on zero says the opposite of what you
  meant. Those are correctness problems, and they are what we spend the week on.

