overview: >
  This week's model is a 15 km by 10 km piece of the Tucson basin. On Tuesday
  we test how small the cells need to be and use `ibound` to mark which part of
  the rectangular grid is aquifer. On Thursday we make the layer unconfined,
  work through a run that does not converge with the default solver settings,
  and deal with dry cells. We finish with a first look at the Pinal County model
  you will use for Project 3.

