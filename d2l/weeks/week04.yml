week: 4
title: "Week 4 — Arrays and iterative solutions"
dates: "September 15 & 17, 2026"

overview: >
  Two ideas that belong together. numpy gives you a container for numbers that
  lets you operate on all of them at once — which is both shorter to write and
  dramatically faster, and is how every model grid you touch from Week 10 is
  represented. Iteration is how you solve equations you cannot rearrange by
  hand. By Thursday you will have written a bisection solver and found out
  first-hand what happens to an explicit time-stepping scheme when the time
  step gets too big.

