week: 7
title: "Week 7 — Uncertainty and hypothesis testing"
dates: "October 6 & 8, 2026"
overview: >
  An apparent difference is not yet evidence. This week uses paired Tucson-area
  monitoring wells to ask whether a change in median depth to water is larger
  than the variability expected under a no-change model. Students identify the
  observational unit, report an effect in feet, construct a permutation null
  distribution, bootstrap an uncertainty interval, and write a conclusion that
  distinguishes evidence from a causal mechanism.

