week: 7
title: "Week 7 — Timeseries analysis with pandas"
dates: "October 6 & 8, 2026"
overview: >
  Almost everything in hydrology is a time series, and pandas has a whole second
  personality for them. Give a DataFrame a DatetimeIndex and you can ask for
  "2015", "every August", "a 30-day average", or "annual totals by water year"
  without writing a single loop over dates. This week covers resampling and
  choosing the right aggregation, the water year and why it starts in October,
  rolling windows and what centring one costs you, and reshaping between long
  and wide format.

