week: 10
title: "Week 10 — Introduction to MODFLOW and FloPy"
dates: "October 27 & 29, 2026"
banner: snakes.png
banner_alt: "Two pythons"

overview: >
  For nine weeks you inferred what the aquifer was doing from patterns in
  observations. From this week you build something that has to obey conservation
  of mass. We cover what MODFLOW is and why it is organised as a package per
  question, how FloPy writes its input files so you never have to, and — most
  importantly — the three checks that go on every model run you will ever do:
  that it converged, that its water budget closes, and that it reproduces a case
  whose answer you already knew.

