overview: >
  This week starts Module 2. On Tuesday we cover what a groundwater model can
  tell you that observations cannot, the conceptual model that comes before the
  grid, the flow equation MODFLOW solves, and how MODFLOW splits its input into
  packages that FloPy writes for you. On Thursday we run a model, check it
  against an analytic solution, and read the `.list` file and the water budget.

