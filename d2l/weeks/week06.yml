week: 6
title: "Week 6 — Working with real-world data"
dates: "September 29 & October 1, 2026"
overview: >
  Last week's dataset was already tidy, because I tidied it. This week you get
  data the way it actually arrives: from an API, with gaps in it, duplicate
  rows, and values that look impossible but aren't. We cover pulling records
  from the USGS, writing a fetch that survives the service being down, and the
  judgement calls involved in deciding what is missing, what is zero, and which
  outliers are errors rather than floods. None of those decisions come from the
  data — they come from knowing what the number means.

