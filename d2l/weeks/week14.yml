week: 14
title: "Week 14 — Layered models, rivers, and loading existing models"
dates: "November 24, 2026 (Tuesday only)"
banner: snakes.png
banner_alt: "Two pythons"

overview: >
  One session this week; Thanksgiving is Thursday. Two topics, and they are the
  two you are most likely to need in practice. Layers, because aquifers are not
  one thing and a confining unit changes where the water comes from. And loading
  a model somebody else built, because that is how most groundwater modelling
  starts — you will rarely build from nothing. We finish by changing one
  unmeasured parameter and comparing two runs, which is the difference between a
  hypothesis and a result.

