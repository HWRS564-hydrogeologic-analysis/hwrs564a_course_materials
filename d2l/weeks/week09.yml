week: 9
title: "Week 9 — Statistics, regression, and water chemistry"
dates: "October 20 & 22, 2026"
overview: >
  Two halves this week. Tuesday develops regression from the least-squares
  objective through the slope formula, variance decomposition, standard error,
  confidence interval, and hypothesis test. We then use residual structure and
  serial correlation to decide whether that ordinary uncertainty is credible,
  and compare random with chronological validation using MAE, RMSE, and test
  R-squared. Thursday is major-ion chemistry: converting to meq/L, checking that
  an analysis balances, and reading a Piper diagram of Tucson groundwater.

