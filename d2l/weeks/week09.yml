week: 9
title: "Week 9 — Statistics, regression, and water chemistry"
dates: "October 20 & 22, 2026"
overview: >
  Two halves this week. Tuesday is regression: fitting a trend is one function
  call, and everything worth learning is in what you do next — reading the
  residuals, understanding why a high R-squared is not evidence of a good
  model, and splitting a time series for validation in a way that doesn't
  flatter itself. Thursday is major-ion chemistry: converting to meq/L,
  checking that an analysis balances before you trust it, and reading a Piper
  diagram of real Tucson basin groundwater.

