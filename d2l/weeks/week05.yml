overview: >
  pandas gives numpy values meaningful row and column labels, then adds a rich
  vocabulary for time. This week we read Tucson well and water-level records,
  select and filter observations, turn date strings into a DatetimeIndex, and
  calculate monthly, water-year, grouped, and rolling summaries. By Thursday
  you can move from a raw labelled table to a defensible hydrologic time series.

