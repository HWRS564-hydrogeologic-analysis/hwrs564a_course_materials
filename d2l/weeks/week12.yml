week: 12
title: "Week 12 — Discretization and boundary conditions"
dates: "November 10 & 12, 2026"
overview: >
  Last week's model converged on the first try because the aquifer was confined,
  which makes the equations linear. This week you take the confining layer off,
  the physics gets more realistic, and the model stops converging — and dealing
  with that is most of what a modeller actually does. On the way we test whether
  the answer depends on the cell size you chose, use `ibound` to cut a
  basin-shaped domain out of a rectangle, and meet dry cells, which are a
  modelling failure rather than a result.

