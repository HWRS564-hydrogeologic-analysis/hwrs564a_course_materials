week: 12
title: "Week 12 — Working with real-world data"
dates: "November 10 & 12, 2026"

overview: >
  This week we download data from the USGS with the `dataretrieval` package.
  On Tuesday we cover what an API request is, why to use `waterdata` rather than
  the older `nwis` functions, how to fall back to a saved copy when a request
  fails, and how to find a site before downloading its record. We pull daily
  discharge at Sabino Creek and water levels at a Tucson well, put them on one
  time axis, and survey in situ and remote-sensing sources beyond the USGS. The
  lab downloads every USGS water level in the Pinal AMA and compares the trends
  with the Pinal County model.

