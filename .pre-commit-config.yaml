# Instructor-side hooks. Install once:  uv run pre-commit install
#
# The one that matters is nbstripout. Committed notebook outputs make diffs
# unreadable, bloat the repo, and produce a merge conflict on every re-run.
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # The `solutions:` block in a lab's notebook metadata is source, not
        # output — losing it would silently break fill_solutions.py.
        args: ["--keep-metadata-keys", "solutions"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        files: ^(quizzes|d2l/weeks|slides)/.*\.ya?ml$
      - id: check-added-large-files
        # Datasets over ~10 MB are fetched with pooch, not committed (§1.3).
        args: ["--maxkb=10240"]
