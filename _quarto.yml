# NOTE: quarto-live's `pyodide` / `webr` / `live` keys must be nested under the
# `live-*` format key in a project file, not at the top level. Quarto's
# project metadata merging only reaches them there.
# Slide-only settings live in slides/_metadata.yml.
format:
  live-html:
    theme:
      - cosmo
      - theme/ua.scss
    toc: true
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    pyodide:
      packages:
        - numpy
        - matplotlib
        - pandas
    live:
      show-hints: true
      show-solutions: true
